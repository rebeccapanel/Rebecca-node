name: Binary Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  release:
    types:
      - published
      - prereleased

permissions:
  contents: write

jobs:
  build-extra-vpn-assets:
    # Pinned companion runtimes are unchanged by node-only dev updates. Keep
    # existing dev assets; rebuild them for releases or an explicit manual run.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            loader_arch: x86_64
          - arch: arm64
            platform: linux/arm64
            loader_arch: aarch64
    steps:
      - uses: docker/setup-qemu-action@v3
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amneziawg-go
          ref: b5928efb6ca19f0153958460c3d141f04abc5c2e
          path: amneziawg-go
      - uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amneziawg-tools
          ref: ee0f0a9aa34ff0a0da4b3433b9512781cfe02843
          path: amneziawg-tools
      - name: Build official AmneziaWG and SSTP runtime assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --rm --platform "${{ matrix.platform }}" \
            -e CGO_ENABLED=0 -e ASSET_ARCH="${{ matrix.arch }}" \
            -v "$PWD/amneziawg-go:/src:ro" -v "$PWD/dist:/out" golang:1.25-alpine sh -euxc '
              cp -a /src /build && cd /build
              go build -trimpath -ldflags="-s -w" -o "/out/rebecca-amneziawg-go-linux-${ASSET_ARCH}" .
            '
          docker run --rm --platform "${{ matrix.platform }}" \
            -e ASSET_ARCH="${{ matrix.arch }}" \
            -v "$PWD/amneziawg-tools:/src:ro" -v "$PWD/dist:/out" alpine:3.22 sh -euxc '
              apk add --no-cache build-base linux-headers >/dev/null
              cp -a /src /build && cd /build/src
              make WITH_WGQUICK=no WITH_BASHCOMPLETION=no WITH_SYSTEMDUNITS=no LDFLAGS=-static
              strip wg
              cp wg "/out/rebecca-amneziawg-tools-linux-${ASSET_ARCH}"
            '
          docker run --rm --platform "${{ matrix.platform }}" \
            -e ASSET_ARCH="${{ matrix.arch }}" -e ARCH="${{ matrix.loader_arch }}" \
            -v "$PWD/tools/build-accel-bundle.sh:/build.sh:ro" -v "$PWD/dist:/out" alpine:3.22 sh /build.sh
          sudo chown -R "$USER:$USER" dist
          for file in dist/rebecca-*-linux-${{ matrix.arch }}*; do
            [[ "$file" == *.sha256 ]] || sha256sum "$file" > "${file}.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rebecca-extra-vpn-linux-${{ matrix.arch }}
          path: dist/rebecca-*

  build-patched-telemt:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            rust_arch: x86_64
          - arch: arm64
            platform: linux/arm64
            rust_arch: aarch64
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Checkout patched telemt
        uses: actions/checkout@v4
        with:
          repository: Sir-MmD/telemt
          ref: 1e6549df23136a676ef8ec36ef0f1d9af2a1083d
          path: telemt

      - name: Build patched telemt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --rm --platform "${{ matrix.platform }}" \
            -e RUST_ARCH="${{ matrix.rust_arch }}" \
            -v "$PWD/telemt:/src:ro" -v "$PWD/dist:/out" rust:alpine sh -euxc '
              apk add --no-cache build-base musl-dev pkgconf cmake perl >/dev/null
              cp -a /src /build && cd /build
              grep -q user_modes src/config/types.rs
              grep -q socks_user_from_account src/config/types.rs
              grep -q "cfg.general.modes = new.general.modes" src/config/hot_reload.rs
              export RUSTFLAGS="-C target-feature=+crt-static"
              target="${RUST_ARCH}-unknown-linux-musl"
              cargo build --release --locked --target "$target"
              cp "target/$target/release/telemt" "/out/rebecca-telemt-linux-${{ matrix.arch }}"
            '
          sudo chown "$USER:$USER" "dist/rebecca-telemt-linux-${{ matrix.arch }}"
          sha256sum "dist/rebecca-telemt-linux-${{ matrix.arch }}" > \
            "dist/rebecca-telemt-linux-${{ matrix.arch }}.sha256"

      - name: Upload patched telemt artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebecca-telemt-linux-${{ matrix.arch }}
          path: |
            dist/rebecca-telemt-linux-${{ matrix.arch }}
            dist/rebecca-telemt-linux-${{ matrix.arch }}.sha256

  build-linux:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: "1.22"
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_arch: "386"
            goarch: "386"
            goarm: ""
          - asset_arch: amd64
            goarch: amd64
            goarm: ""
          - asset_arch: arm64
            goarch: arm64
            goarm: ""
          - asset_arch: armv5
            goarch: arm
            goarm: "5"
          - asset_arch: armv6
            goarch: arm
            goarm: "6"
          - asset_arch: armv7
            goarch: arm
            goarm: "7"
          - asset_arch: s390x
            goarch: s390x
            goarm: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            UPLOAD_RELEASE="true"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            RELEASE_TAG="${GITHUB_REF_NAME}"
            UPLOAD_RELEASE="true"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA::7}"
            RELEASE_TAG=""
            UPLOAD_RELEASE="false"
          else
            REF_SLUG="$(echo "${GITHUB_REF_NAME}" | tr '/[:space:]' '-' | tr -cd '[:alnum:]._-')"
            VERSION="${REF_SLUG}-${GITHUB_SHA::7}"
            RELEASE_TAG=""
            UPLOAD_RELEASE="false"
          fi

          SHOULD_BUILD="false"
          if [[ "${UPLOAD_RELEASE}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "push" ]]; then
            SHOULD_BUILD="true"
          fi

          ARTIFACT_NAME="rebecca-node-binaries-linux-${{ matrix.asset_arch }}"
          NODE_ASSET_NAME="rebecca-node-${VERSION}-linux-${{ matrix.asset_arch }}"

          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "node_asset_name=${NODE_ASSET_NAME}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "should_build=${SHOULD_BUILD}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        if: steps.meta.outputs.should_build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test runtime safety and user synchronization
        if: steps.meta.outputs.should_build == 'true' && matrix.asset_arch == 'amd64'
        run: go test ./internal/node ./internal/xray -count=1 -timeout=150s

      - name: Build binary
        if: steps.meta.outputs.should_build == 'true'
        env:
          REBECCA_NODE_GOOS: linux
          REBECCA_NODE_GOARCH: ${{ matrix.goarch }}
          REBECCA_NODE_GOARM: ${{ matrix.goarm }}
        run: go run ./tools/build

      - name: Smoke test binary
        if: steps.meta.outputs.should_build == 'true' && matrix.asset_arch == 'amd64'
        run: go run ./tools/smoke

      - name: Prepare artifact
        if: steps.meta.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mv dist/rebecca-node "dist/${{ steps.meta.outputs.node_asset_name }}"
          sha256sum "dist/${{ steps.meta.outputs.node_asset_name }}" > "dist/${{ steps.meta.outputs.node_asset_name }}.sha256"

      - name: Upload artifact
        if: steps.meta.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            dist/${{ steps.meta.outputs.node_asset_name }}
            dist/${{ steps.meta.outputs.node_asset_name }}.sha256

  build-windows-amd64:
    runs-on: windows-latest
    env:
      GO_VERSION: "1.22"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $version = "${{ github.event.release.tag_name }}"
            $releaseTag = "${{ github.event.release.tag_name }}"
            $shouldBuild = "true"
          } elseif ("${env:GITHUB_REF_TYPE}" -eq "tag") {
            $version = "${env:GITHUB_REF_NAME}"
            $releaseTag = "${env:GITHUB_REF_NAME}"
            $shouldBuild = "true"
          } elseif ("${{ github.event_name }}" -eq "pull_request") {
            $version = "pr-${{ github.event.pull_request.number }}-$($env:GITHUB_SHA.Substring(0, 7))"
            $releaseTag = ""
            $shouldBuild = "false"
          } else {
            $refSlug = "${env:GITHUB_REF_NAME}" -replace "[/\s]", "-"
            $refSlug = $refSlug -replace "[^A-Za-z0-9._-]", ""
            $version = "$refSlug-$($env:GITHUB_SHA.Substring(0, 7))"
            $releaseTag = ""
            $shouldBuild = "true"
          }

          "artifact_name=rebecca-node-binaries-windows-amd64" >> $env:GITHUB_OUTPUT
          "node_asset_name=rebecca-node-$version-windows-amd64.exe" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "should_build=$shouldBuild" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        if: steps.meta.outputs.should_build == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        if: steps.meta.outputs.should_build == 'true'
        env:
          REBECCA_NODE_GOOS: windows
          REBECCA_NODE_GOARCH: amd64
        run: go run ./tools/build

      - name: Smoke test binary
        if: steps.meta.outputs.should_build == 'true'
        run: go run ./tools/smoke

      - name: Prepare artifact
        if: steps.meta.outputs.should_build == 'true'
        shell: pwsh
        run: |
          Move-Item -LiteralPath dist\rebecca-node.exe -Destination "dist\${{ steps.meta.outputs.node_asset_name }}"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist\${{ steps.meta.outputs.node_asset_name }}").Hash.ToLowerInvariant()
          "$hash  ${{ steps.meta.outputs.node_asset_name }}" | Set-Content -NoNewline -Path "dist\${{ steps.meta.outputs.node_asset_name }}.sha256"

      - name: Upload artifact
        if: steps.meta.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            dist/${{ steps.meta.outputs.node_asset_name }}
            dist/${{ steps.meta.outputs.node_asset_name }}.sha256

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-extra-vpn-assets
      - build-patched-telemt
      - build-linux
      - build-windows-amd64
    if: github.event_name == 'release' || github.ref_type == 'tag'

    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rebecca-*
          path: release-assets
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ steps.meta.outputs.release_tag }}"
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
            gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes "Rebecca Node ${RELEASE_TAG}"
          gh release delete-asset "${RELEASE_TAG}" rebecca-node -y >/dev/null 2>&1 || true
          gh release upload "${RELEASE_TAG}" release-assets/rebecca-* --clobber

  publish-dev-binaries:
    runs-on: ubuntu-latest
    needs:
      - build-extra-vpn-assets
      - build-patched-telemt
      - build-linux
      - build-windows-amd64
    # Native jobs are intentionally skipped on ordinary dev pushes. A skipped
    # dependency must not prevent publication of successful node binaries.
    if: >-
      always() && github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build-linux.result == 'success' && needs.build-windows-amd64.result == 'success' &&
      (needs.build-extra-vpn-assets.result == 'success' || needs.build-extra-vpn-assets.result == 'skipped') &&
      (needs.build-patched-telemt.result == 'success' || needs.build-patched-telemt.result == 'skipped')

    steps:
      - name: Download dev artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rebecca-*
          path: release-assets
          merge-multiple: true

      - name: Normalize dev asset names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dev-assets

          shopt -s nullglob
          for file in release-assets/rebecca-node-*-linux-*; do
            [[ "$file" == *.sha256 ]] && continue
            base="$(basename "$file")"
            arch="${base##*-linux-}"
            dest="dev-assets/rebecca-node-dev-linux-${arch}"
            cp "$file" "$dest"
            sha256sum "$dest" > "${dest}.sha256"
          done

          for file in release-assets/rebecca-node-*-windows-amd64.exe; do
            [[ "$file" == *.sha256 ]] && continue
            dest="dev-assets/rebecca-node-dev-windows-amd64.exe"
            cp "$file" "$dest"
            sha256sum "$dest" > "${dest}.sha256"
          done

          for file in release-assets/rebecca-telemt-linux-*; do
            [[ "$file" == *.sha256 ]] && continue
            arch="${file##*-linux-}"
            dest="dev-assets/rebecca-telemt-dev-linux-${arch}"
            cp "$file" "$dest"
            sha256sum "$dest" > "${dest}.sha256"
          done

          for file in release-assets/rebecca-amneziawg-*-linux-*; do
            [[ "$file" == *.sha256 ]] && continue
            base="$(basename "$file")"
            name="${base#rebecca-}"
            component="${name%%-linux-*}"
            arch="${base##*-linux-}"
            dest="dev-assets/rebecca-${component}-dev-linux-${arch}"
            cp "$file" "$dest"
            sha256sum "$dest" > "${dest}.sha256"
          done

          for file in release-assets/rebecca-accel-ppp-linux-*.tar.gz; do
            base="$(basename "$file")"
            arch="${base#rebecca-accel-ppp-linux-}"
            arch="${arch%.tar.gz}"
            dest="dev-assets/rebecca-accel-ppp-dev-linux-${arch}.tar.gz"
            cp "$file" "$dest"
            sha256sum "$dest" > "${dest}.sha256"
          done

          test -n "$(find dev-assets -type f ! -name '*.sha256' -print -quit)"

      - name: Publish dev binary release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="dev-binaries"
          TITLE="Rebecca Node dev binaries"
          NOTES="Latest successful dev binary artifacts for commit ${GITHUB_SHA}."

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${TITLE}" \
              --notes "${NOTES}" \
              --prerelease \
              --target "${GITHUB_SHA}"
          else
            gh release create "${RELEASE_TAG}" \
              --title "${TITLE}" \
              --notes "${NOTES}" \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi

          gh release upload "${RELEASE_TAG}" dev-assets/* --clobber
